name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_USER: prior
          POSTGRES_PASSWORD: prior
          POSTGRES_DB: prior_auth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prior -d prior_auth"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://prior:prior@localhost:5432/prior_auth
      JWT_SECRET: ci-secret-32-bytes-minimum-key!!
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.15"
      - run: uv sync
      - run: uv run ruff check app tests
      - run: uv run alembic upgrade head
      - run: uv run pytest -q --cov=app --cov-report=term-missing

  mutate:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_USER: prior
          POSTGRES_PASSWORD: prior
          POSTGRES_DB: prior_auth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prior -d prior_auth"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://prior:prior@localhost:5432/prior_auth
      JWT_SECRET: ci-secret-32-bytes-minimum-key!!
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.15"
      - run: uv sync
      - run: uv run alembic upgrade head
      - name: mutmut prior_auth services
        run: |
          uv run mutmut run
          uv run mutmut results

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t prior-auth-api:ci .
