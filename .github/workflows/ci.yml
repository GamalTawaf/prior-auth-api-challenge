name: ci
on: [push, pull_request]

env:
  DATABASE_URL: postgresql+psycopg://prior:prior@localhost:5432/prior_auth
  JWT_SECRET: ci-secret-32-bytes-minimum-key!!

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-project
      - name: ruff format
        run: ./scripts/ci_run.sh "ruff format" -- uv run ruff format --check app tests scripts
      - name: ruff lint
        run: ./scripts/ci_run.sh "ruff lint" -- uv run ruff check app tests scripts
      - name: call style
        run: ./scripts/ci_run.sh "call style" -- uv run python scripts/check_call_style.py
      - name: fastapi compile + OpenAPI
        run: ./scripts/ci_run.sh "fastapi compile" -- uv run python scripts/check_fastapi_compile.py

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_USER: prior
          POSTGRES_PASSWORD: prior
          POSTGRES_DB: prior_auth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prior -d prior_auth"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-project
      - name: alembic migrate
        run: ./scripts/ci_run.sh "alembic upgrade head" -- uv run alembic upgrade head
      - name: pytest + coverage
        run: ./scripts/ci_run.sh "pytest + coverage" --tail 40 -- uv run pytest -q --cov=app --cov-report=term-missing

  mutate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_USER: prior
          POSTGRES_PASSWORD: prior
          POSTGRES_DB: prior_auth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prior -d prior_auth"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-project
      - name: alembic migrate
        run: ./scripts/ci_run.sh "alembic upgrade head" -- uv run alembic upgrade head
      - name: mutmut prior_auth services
        env:
          MUTMUT_MAX_SURVIVORS: "0"
        run: ./scripts/ci_run.sh "mutmut" --tail 40 -- ./scripts/run_mutmut.sh

  image:
    needs: [lint, test, mutate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker build (no push)
        run: ./scripts/ci_run.sh "docker build" --tail 30 -- docker build -t prior-auth-api:ci .
