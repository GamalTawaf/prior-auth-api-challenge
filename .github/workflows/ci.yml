name: ci
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.15"
      - name: uv sync
        run: |
          uv sync
          {
            echo "### uv sync: PASSED"
            echo ""
            echo "Installed prod + dependency-groups.dev for Python 3.15"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
      - name: ruff format
        run: |
          set -o pipefail
          out="$(mktemp)"
          if uv run ruff format --check app tests scripts | tee "$out"; then
            {
              echo "### ruff format: PASSED"
              echo ""
              echo '```'
              cat "$out"
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ruff format: FAILED"
              echo ""
              echo '```'
              cat "$out"
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: ruff lint
        run: |
          set -o pipefail
          out="$(mktemp)"
          if uv run ruff check app tests scripts | tee "$out"; then
            {
              echo "### ruff lint: PASSED"
              echo ""
              echo '```'
              cat "$out"
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ruff lint: FAILED"
              echo ""
              echo '```'
              cat "$out"
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: call style
        run: |
          set -o pipefail
          out="$(mktemp)"
          if uv run python scripts/check_call_style.py | tee "$out"; then
            {
              echo "### call style: PASSED"
              echo ""
              echo "No nested non-constructor calls or conditions inside function call arguments (app/)."
              echo ""
              echo '```'
              cat "$out"
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### call style: FAILED"
              echo ""
              echo '```'
              cat "$out"
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: fastapi compile + OpenAPI
        run: |
          set -o pipefail
          out="$(mktemp)"
          if uv run python scripts/check_fastapi_compile.py | tee "$out"; then
            {
              echo "### fastapi compile: PASSED"
              echo ""
              echo '```'
              cat "$out"
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### fastapi compile: FAILED"
              echo ""
              echo '```'
              cat "$out"
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_USER: prior
          POSTGRES_PASSWORD: prior
          POSTGRES_DB: prior_auth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prior -d prior_auth"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://prior:prior@localhost:5432/prior_auth
      JWT_SECRET: ci-secret-32-bytes-minimum-key!!
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.15"
      - name: uv sync
        run: |
          uv sync
          echo "### uv sync: PASSED" >> "$GITHUB_STEP_SUMMARY"
      - name: alembic migrate
        run: |
          set -o pipefail
          out="$(mktemp)"
          if uv run alembic upgrade head | tee "$out"; then
            {
              echo "### alembic upgrade head: PASSED"
              echo ""
              echo '```'
              cat "$out"
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### alembic upgrade head: FAILED"
              echo ""
              echo '```'
              cat "$out"
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: pytest + coverage
        run: |
          set -o pipefail
          out="$(mktemp)"
          if uv run pytest -q --cov=app --cov-report=term-missing | tee "$out"; then
            {
              echo "### pytest + coverage: PASSED"
              echo ""
              echo '```'
              tail -n 40 "$out"
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### pytest + coverage: FAILED"
              echo ""
              echo '```'
              tail -n 60 "$out"
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  mutate:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_USER: prior
          POSTGRES_PASSWORD: prior
          POSTGRES_DB: prior_auth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prior -d prior_auth"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://prior:prior@localhost:5432/prior_auth
      JWT_SECRET: ci-secret-32-bytes-minimum-key!!
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.15"
      - run: uv sync
      - run: uv run alembic upgrade head
      - name: mutmut prior_auth services
        env:
          # Drive toward 0; parallel mutmut is unsafe on shared Postgres (see scripts/run_mutmut.sh).
          MUTMUT_MAX_SURVIVORS: "0"
        run: |
          set -o pipefail
          out="$(mktemp)"
          if ./scripts/run_mutmut.sh | tee "$out"; then
            {
              echo "### mutmut: PASSED"
              echo ""
              echo '```'
              tail -n 40 "$out"
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### mutmut: FAILED"
              echo ""
              echo '```'
              tail -n 60 "$out"
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build (no push)
        run: |
          set -o pipefail
          out="$(mktemp)"
          if docker build -t prior-auth-api:ci . | tee "$out"; then
            {
              echo "### docker build: PASSED"
              echo ""
              echo "Image tag: \`prior-auth-api:ci\` (not pushed)"
              echo ""
              echo '```'
              tail -n 30 "$out"
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### docker build: FAILED"
              echo ""
              echo '```'
              tail -n 60 "$out"
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
