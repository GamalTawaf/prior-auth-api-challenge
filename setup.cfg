[mutmut]
source_paths=app/
only_mutate=app/prior_auth/service.py
# Shared query/validation helpers live in helpers.py (not mutated); use-cases in service.py.
# One argv token per line — spaces here become a single invalid pytest arg.
pytest_add_cli_args=--no-cov
pytest_add_cli_args_test_selection=tests/
# Non-Python deps (tests, lockfile, setup.cfg) changed → invalidate cached mutant results.
on_dependency_change=rerun
cache_invalidation_files=tests/,setup.cfg,pyproject.toml,uv.lock,scripts/
